# ──────────────────────────────────────────────
# 매매 전략 파라미터
# ──────────────────────────────────────────────
strategy:
  # 매수 조건 ─ 모멘텀
  momentum_period: 5          # 모멘텀 계산 봉 수
  momentum_threshold: 0.003   # 상승률 임계값 (0.3%)

  # 매수 조건 ─ 평균 회귀
  rsi_period: 14              # RSI 계산 기간
  rsi_oversold: 35            # RSI 과매도 기준 (매수 신호)
  rsi_overbought: 65          # RSI 과매수 기준 (매도 신호)

  # 이익실현 / 손절
  take_profit: 0.005          # 목표 수익률 (0.5%)
  stop_loss:   0.003          # 손절 비율   (0.3%)

  # 포지션 관리
  max_positions: 3            # 동시 보유 종목 수 상한
  position_size: 0.2          # 계좌 잔고 대비 1종목 투자 비중 (20%)

  # 리스크 관리
  daily_loss_limit: 0.02      # 일일 최대 손실 한도 (2%)
  max_trade_amount: 1_000_000 # 1회 최대 매매금액 (원)

# ──────────────────────────────────────────────
# 대상 ETF 종목 코드 (코스피/코스닥 국내 ETF)
# ──────────────────────────────────────────────
etf_universe:
  - "114800"   # KODEX 인버스
  - "122630"   # KODEX 레버리지
  - "233740"   # KODEX 코스닥150 레버리지
  - "251340"   # KODEX 코스닥150 인버스(2X)
  - "069500"   # KODEX 200
  - "102110"   # TIGER 200
  - "252670"   # KODEX 200선물인버스2X
  - "278530"   # KODEX 200TR
  - "091160"   # KODEX 반도체
  - "091170"   # KODEX 은행
  - "157490"   # KODEX 운송
  - "139220"   # TIGER 200 IT
  - "228790"   # TIGER 화학소재
  - "266370"   # KODEX 2차전지산업
  - "305720"   # KODEX 2차전지산업
  - "364980"   # TIGER 2차전지테마

# ──────────────────────────────────────────────
# 스케줄 / 운영 시간
# ──────────────────────────────────────────────
schedule:
  market_open:  "09:00"       # 장 시작 시각
  market_close: "15:20"       # 장 마감 시각 (15:30 전 청산)
  scan_interval: 10           # 종목 스캔 주기 (초)
  price_history_bars: 60      # 가격 히스토리 유지 봉 수
